<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sebar Produk 1-Klik</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><h1>🚀 Sebar Produk 1-Klik</h1><p>Masukkan produk sekali, buat banyak konten, lalu ukur hasilnya.</p></header><section class="card"><h2>1. Produk</h2><input id="name" placeholder="Nama produk"><input id="price" type="number" placeholder="Harga"><input id="url" placeholder="Link pembelian"><textarea id="desc" placeholder="Deskripsi singkat produk"></textarea><button onclick="save()">Simpan Produk</button></section><section class="card"><h2>2. SEBAR SEKARANG</h2><button class="primary" onclick="sebar()">SEBAR SEKARANG</button><div id="status"></div></section><section class="card"><h2>3. Konten</h2><div id="content"></div></section></main><script src="/static/app.js"></script></body></html>
